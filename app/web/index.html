<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESA 工作台</title><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/tasks.css"></head>
<body><header><strong>ESA 企业服务工作台</strong><span id="mode"></span><span id="connection">正在连接</span></header>
<div class="layout"><nav aria-label="主导航"><button data-view="conversations">会话工作台</button><button data-view="knowledge" aria-selected="true">知识问答</button><button data-view="tasks">服务任务</button><button data-view="library">资料库</button><button data-view="desk">本地服务台</button><button data-view="settings">设置</button></nav>
<main><aside id="onboarding" role="status">开始使用：设置本机模型，导入资料并建立索引，然后在会话中开始。</aside><div id="error" role="alert" hidden></div>
<section id="conversations"><h1 id="conversationTitle">会话工作台</h1>
<div class="conversation-toolbar"><label>资料库<select id="conversationBase"></select></label><label>新会话标题<input id="conversationName" maxlength="200"></label><button id="newConversation" type="button">新建会话</button></div>
<div class="conversation-layout"><aside id="conversationList"></aside><div><div id="conversationTimeline"></div><div id="conversationProgress"></div>
<form id="conversationForm"><label>消息<textarea id="conversationText" required maxlength="2000" placeholder="可以问资料、补充信息，或同时改期并问政策；提交后也可查询当前状态。"></textarea></label><label><input id="conversationDeep" type="checkbox">深入检索（分题搜索与阅读）</label><button>发送</button></form>
<details><summary>在当前会话开始一个服务事项</summary><form id="conversationTaskForm"><label>服务<select id="conversationService"></select></label><label>操作上限<select id="conversationScope"><option value="READ_ONLY">只读查询，不准备申请</option><option value="PREVIEW_ONLY">生成预览，绝不提交</option><option value="SUBMIT_AFTER_CONFIRMATION">预览后由我精确确认提交</option></select></label><label><input type="checkbox" id="conversationScopeConfirmed" required>我确认任务范围；这不是提交确认</label><button>开始服务事项</button></form></details></div><aside><div id="conversationSide"></div><div id="conversationTaskProgressSlot"></div></aside></div></section>
<section id="knowledge"><h1>知识问答</h1><form id="askForm"><label>资料库<select id="askBase" required></select></label><label>问题<textarea id="question" required maxlength="2000"></textarea></label><label><input id="detailed" type="checkbox">深入查找（分题搜索与阅读）</label><button>回答</button><button id="newTopic" type="button">开始新话题</button><output id="followupState"></output></form><div id="knowledgeState" class="empty">先在资料库导入文档并建立索引</div><div id="knowledgeProgress"></div><div id="answerHistory"></div></section>
<section id="tasks" hidden><h1>服务任务</h1><details id="newTaskPanel" open><summary>新建任务</summary><form id="newTaskForm"><label>服务<select id="taskKind"><option value="loan">临时电脑借用</option value="knowledge">通过 Agent 查询知识</option></select></label><label>操作上限<select id="taskScope"><option value="READ_ONLY">只读查询，不准备申请</option><option value="PREVIEW_ONLY">只生成预览，绝不提交</option><option value="SUBMIT_AFTER_CONFIRMATION">预览后由我精确确认提交</option></select></label><label>关联资料库<select id="taskBase"></select></label><label>知识问题<textarea id="taskQuestion" maxlength="600"></textarea></label><label><input id="scopeConfirmed" type="checkbox" required>我确认上述任务范围；这不代表确认提交申请</label><button>创建任务</button></form></details><div class="task-layout"><aside id="taskList" class="empty">暂无任务</aside><div id="taskPane"><div id="taskDetail"></div></div><aside id="taskProgressSlot"><div id="taskProgress"></div></aside></div></section>
<section id="library" hidden><h1>资料库</h1><form id="baseForm"><label>新资料库名称<input id="baseName" required maxlength="200"></label><button>创建资料库</button></form><form id="uploadForm"><label>资料库<select id="uploadBase" required></select></label><label>文档<input id="documentFile" type="file" accept=".md,.txt,.pdf,.docx" multiple required></label><label>资料类型<select id="documentSourceType"><option value="wiki">一般资料 / Wiki</option><option value="policy">制度</option><option value="meeting">会议资料</option><option value="ticket">工单资料</option></select></label><label>关联已支持服务（可选）<select id="documentService"><option value="">无关联</option><option value="loan">电脑借用</option><option value="repair">IT报修</option></select></label><button>批量导入文档</button><button id="buildIndex" type="button">建立 / 更新索引</button></form><button id="refreshLibrary" type="button">刷新处理状态</button><div id="documentList" class="empty">暂无资料</div><pre id="jobList"></pre></section>
<section id="desk" hidden><h1>本地合成 TEST 服务台</h1><p>仅处理当前本地身份的合成工单，不代表企业审批系统。原提交回执保持不变，以下是当前业务状态。</p><button id="refreshDesk">刷新当前工单</button><div id="deskTickets"></div><details><summary>实际日期预留（结束日内部采用次日半开区间）</summary><pre id="deskSchedule"></pre></details></section>
<section id="settings" hidden><h1>设置</h1><form id="settingsForm"><label>模型服务地址<input id="endpoint" type="url" required></label><label>聊天模型<input id="chatModel" required></label><label>嵌入模型<input id="embeddingModel" required></label><button type="submit">保存设置</button><output id="saved"></output></form><h2>能力状态</h2><dl id="capabilities"></dl><details><summary>存储位置</summary><pre id="paths"></pre></details></section>
</main></div><script type="module" src="/assets/workbench.js"></script></body></html>
