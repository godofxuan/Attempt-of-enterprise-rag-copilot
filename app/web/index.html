<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESA 工作台</title><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/tasks.css"></head>
<body><header><strong>ESA 企业服务工作台</strong><span id="mode"></span><span id="connection">正在连接</span></header>
<div class="layout"><nav aria-label="主导航"><button data-view="knowledge" aria-selected="true">知识问答</button><button data-view="tasks">服务任务</button><button data-view="library">资料库</button><button data-view="settings">设置</button></nav>
<main><div id="error" role="alert" hidden></div>
<section id="knowledge"><h1>知识问答</h1><form id="askForm"><label>资料库<select id="askBase" required></select></label><label>问题<textarea id="question" required maxlength="2000"></textarea></label><label><input id="detailed" type="checkbox">深入查找（有界补查）</label><button>回答</button><button id="newTopic" type="button">开始新话题</button><output id="followupState"></output></form><div id="knowledgeState" class="empty">先在资料库导入文档并建立索引</div><div id="knowledgeProgress"></div><div id="answerHistory"></div></section>
<section id="tasks" hidden><h1>服务任务</h1><details id="newTaskPanel" open><summary>新建任务</summary><form id="newTaskForm"><label>服务<select id="taskKind"><option value="loan">临时电脑借用</option value="knowledge">通过 Agent 查询知识</option></select></label><label>操作上限<select id="taskScope"><option value="READ_ONLY">只读查询，不准备申请</option><option value="PREVIEW_ONLY">只生成预览，绝不提交</option><option value="SUBMIT_AFTER_CONFIRMATION">预览后由我精确确认提交</option></select></label><label>关联资料库<select id="taskBase"></select></label><label>知识问题<textarea id="taskQuestion" maxlength="600"></textarea></label><label><input id="scopeConfirmed" type="checkbox" required>我确认上述任务范围；这不代表确认提交申请</label><button>创建任务</button></form></details><div class="task-layout"><aside id="taskList" class="empty">暂无任务</aside><div id="taskDetail"></div><aside id="taskProgress"></aside></div></section>
<section id="library" hidden><h1>资料库</h1><form id="baseForm"><label>新资料库名称<input id="baseName" required maxlength="200"></label><button>创建资料库</button></form><form id="uploadForm"><label>资料库<select id="uploadBase" required></select></label><label>文档<input id="documentFile" type="file" accept=".md,.txt,.pdf,.docx" required></label><button>导入文档</button><button id="buildIndex" type="button">建立 / 更新索引</button></form><button id="refreshLibrary" type="button">刷新处理状态</button><div id="documentList" class="empty">暂无资料</div><pre id="jobList"></pre></section>
<section id="settings" hidden><h1>设置</h1><form id="settingsForm"><label>模型服务地址<input id="endpoint" type="url" required></label><label>聊天模型<input id="chatModel" required></label><label>嵌入模型<input id="embeddingModel" required></label><button type="submit">保存设置</button><output id="saved"></output></form><h2>能力状态</h2><dl id="capabilities"></dl><details><summary>存储位置</summary><pre id="paths"></pre></details></section>
</main></div><script type="module" src="/assets/workbench.js"></script></body></html>
