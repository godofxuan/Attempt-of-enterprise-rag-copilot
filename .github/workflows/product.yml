name: product-regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install '.[dev]'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest tests/product tests/vnext tests/agent_v2/test_a1_draft_delivery.py -q
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
        env:
          ESA_TEST_PYTHON: python
      # No Ollama calls, real credentials, active workspace or production DB here.
