name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app scripts streamlit_app tests

      - name: Verify frozen evaluation hash
        run: python -c "from pathlib import Path; from scripts.eval_enterprise_v2 import verify_frozen_test_hash; expected, actual = verify_frozen_test_hash(Path('data/v2/eval')); assert expected == actual; print(actual)"

      - name: Run deterministic tests
        env:
          PYTHONFAULTHANDLER: "1"
        shell: bash
        run: |
          set -o pipefail
          python -u -X faulthandler -m pytest -vv 2>&1 | tee pytest.log

      - name: Publish deterministic test failure context
        if: failure()
        shell: bash
        run: |
          if [[ -f pytest.log ]]; then
            echo "::group::Last pytest output"
            tail -n 80 pytest.log
            echo "::endgroup::"
            message="$(tail -n 40 pytest.log | tr '\n' ' ' | cut -c1-4000)"
            echo "::error title=pytest crash context::$message"
          fi

      - name: Audit public repository candidates
        run: python -m scripts.audit_public_repo
